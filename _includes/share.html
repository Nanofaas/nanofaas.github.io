{%- assign share_url = page.url | absolute_url -%}
{%- assign enc_url = share_url | url_encode | replace: "+", "%20" -%}
{%- assign enc_title = page.title | url_encode | replace: "+", "%20" -%}
<div class="share">
  <span class="share-label" id="share-label">Share</span>
  <ul aria-labelledby="share-label">
    <li><a href="https://www.linkedin.com/sharing/share-offsite/?url={{ enc_url }}" target="_blank" rel="noopener">LinkedIn</a></li>
    <li><a href="https://x.com/intent/post?url={{ enc_url }}&amp;text={{ enc_title }}" target="_blank" rel="noopener">X</a></li>
    <li><a href="https://bsky.app/intent/compose?text={{ enc_title }}%20{{ enc_url }}" target="_blank" rel="noopener">Bluesky</a></li>
    <li><a href="mailto:?subject={{ enc_title }}&amp;body={{ enc_url }}">Email</a></li>
    <li><button type="button" class="share-copy" data-url="{{ share_url }}">Copy link</button></li>
    <li hidden><button type="button" class="share-native" data-url="{{ share_url }}" data-title="{{ page.title | escape }}">Share…</button></li>
  </ul>
</div>
<script>
  (function () {
    var copy = document.querySelector('.share-copy');
    copy.addEventListener('click', function () {
      // the Clipboard API exists only on HTTPS or localhost
      var copied = navigator.clipboard ? navigator.clipboard.writeText(copy.dataset.url) : Promise.reject();
      copied.then(function () {
        copy.textContent = 'Copied';
      }, function () {
        copy.textContent = 'Copy failed';
      }).then(function () {
        setTimeout(function () { copy.textContent = 'Copy link'; }, 1500);
      });
    });
    var native = document.querySelector('.share-native');
    if (navigator.share) {
      native.parentElement.hidden = false;
      native.addEventListener('click', function () {
        navigator.share({ title: native.dataset.title, url: native.dataset.url }).catch(function () {});
      });
    }
  })();
</script>
