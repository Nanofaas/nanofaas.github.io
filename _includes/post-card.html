<li class="card post-card">
  <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
  <h3 class="post-card-title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3>
  <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncatewords: 40 | escape }}</p>
  <span class="more" aria-hidden="true">Read more →</span>
</li>
